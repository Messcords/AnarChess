name: CI

on:
  push:
    branches:
      - main

jobs:
  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: screens/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: screens

      - name: Prepare Nuxt
        run: pnpm exec nuxt prepare
        working-directory: screens

      - name: Lint frontend
        run: make lint
        working-directory: screens

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: screens/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: screens

      - name: Prepare Nuxt
        run: pnpm exec nuxt prepare
        working-directory: screens

      - name: Test frontend
        run: pnpm test:run
        working-directory: screens

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: endpoints/uv.lock

      - name: Install backend dependencies
        run: uv sync --locked --no-install-project
        working-directory: endpoints

      - name: Lint backend
        run: make lint
        working-directory: endpoints

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: endpoints/uv.lock

      - name: Install backend dependencies
        run: uv sync --locked --no-install-project
        working-directory: endpoints

      - name: Test backend
        run: uv run --no-sync pytest
        working-directory: endpoints
