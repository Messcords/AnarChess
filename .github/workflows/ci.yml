name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: screens/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: screens

      - run: pnpm exec nuxt prepare
        working-directory: screens

      - run: make lint
        working-directory: screens

      - run: make check
        working-directory: screens

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: endpoints/uv.lock

      - run: uv sync --locked --no-install-project
        working-directory: endpoints

      - run: make lint
        working-directory: endpoints

      - run: make check
        working-directory: endpoints
