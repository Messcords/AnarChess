[project]
name = "endpoints"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = []
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.1",
    "pymongo>=4.20.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
endpoints = "endpoints:main"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-v"
python_files = ["test-*.py", "test_*.py", "*_test.py"]
markers = [
    "contract(*operation_ids): operationId(s) from docs/openapi.yaml covered by the test",
]
