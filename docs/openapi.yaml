openapi: 3.1.0
info:
  title: Jeu d'échecs avec Bouffon — API HTTP (5 endpoints)
  version: 0.4.0
  description: >
    Contrat REST (sans WebSocket) : le frontend déplace les pièces,
    le backend gère l'accès, l'état du plateau et l'état de la partie.

servers:
  - url: http://localhost:4010
    description: Serveur local / Prism mock

paths:
  /boards:
    post:
      summary: Créer une partie
      operationId: createBoard
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                includeJester:
                  type: boolean
                  default: true
                ruleSet:
                  type: string
                  default: standard
      responses:
        '201':
          description: Partie créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerAccess'
              example:
                boardId: brd_01
                playerId: plr_01
                role: white
                token: tok_white_01
        '400':
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /boards/{id}/join:
    post:
      summary: Rejoindre une partie
      operationId: joinBoard
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                preferredRole:
                  $ref: '#/components/schemas/PlayerRole'
      responses:
        '200':
          description: Joueur ajouté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerAccess'
              example:
                boardId: brd_01
                playerId: plr_02
                role: black
                token: tok_black_02
        '400':
          description: Requête mal formée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Partie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Partie complète ou terminée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /boards/{id}:
    get:
      summary: Récupérer l'état du plateau et l'état de la partie
      operationId: getBoardState
      parameters:
        - $ref: '#/components/parameters/BoardId'
      responses:
        '200':
          description: État complet du plateau et de la partie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardState'
              example:
                id: brd_01
                gameState:
                  status: in_progress
                  turn: white
                  ruleSet: standard
                  players:
                    - playerId: plr_01
                      role: white
                    - playerId: plr_02
                      role: black
                    - playerId: plr_03
                      role: jester
                  outcome: null
                board:
                  pieces:
                    - id: p_w_p1
                      type: pawn
                      owner: white
                      square: e4
                    - id: p_j_1
                      type: jester_piece
                      owner: jester
                      square: d5
        '400':
          description: Identifiant invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Partie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Synchroniser le nouvel état du plateau et de la partie (depuis le front)
      operationId: updateBoardState
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/PlayerToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardStateUpdate'
            example:
              gameState:
                status: in_progress
                turn: black
                ruleSet: standard
                outcome: null
              board:
                pieces:
                  - id: p_w_p1
                    type: pawn
                    owner: white
                    square: e4
                  - id: p_j_1
                    type: jester_piece
                    owner: jester
                    square: d5
      responses:
        '200':
          description: État mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardState'
        '400':
          description: Payload invalide (ex. coordonnée hors a1..h8)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Jeton joueur invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Partie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Partie déjà terminée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /boards/{id}/reset:
    post:
      summary: Réinitialiser le plateau et l'état de la partie
      operationId: resetBoard
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/PlayerToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ruleSet:
                  type: string
                  description: Nouvelle règle optionnelle pour la manche suivante
      responses:
        '200':
          description: Partie réinitialisée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardState'
        '403':
          description: Jeton joueur invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Partie introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    BoardId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64

    PlayerToken:
      name: X-Player-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 8

  schemas:
    Square:
      type: string
      pattern: '^[a-h][1-8]$'
      examples:
        - e2
        - e4

    PlayerRole:
      type: string
      enum:
        - white
        - black
        - jester

    Piece:
      type: object
      required:
        - id
        - type
        - owner
        - square
      properties:
        id:
          type: string
        type:
          type: string
        owner:
          $ref: '#/components/schemas/PlayerRole'
        square:
          $ref: '#/components/schemas/Square'

    BoardStatus:
      type: string
      enum:
        - waiting
        - in_progress
        - finished

    GameOutcome:
      type: object
      required:
        - winner
        - reason
      properties:
        winner:
          oneOf:
            - $ref: '#/components/schemas/PlayerRole'
            - type: 'null'
        reason:
          type: string
          enum:
            - no_pieces_left
            - specific_rule

    GameState:
      type: object
      required:
        - status
        - turn
        - players
      properties:
        status:
          $ref: '#/components/schemas/BoardStatus'
        turn:
          $ref: '#/components/schemas/PlayerRole'
        ruleSet:
          type: string
          default: standard
        players:
          type: array
          items:
            type: object
            required:
              - playerId
              - role
            properties:
              playerId:
                type: string
              role:
                $ref: '#/components/schemas/PlayerRole'
        outcome:
          oneOf:
            - $ref: '#/components/schemas/GameOutcome'
            - type: 'null'

    Board:
      type: object
      required:
        - pieces
      properties:
        pieces:
          type: array
          items:
            $ref: '#/components/schemas/Piece'

    BoardState:
      type: object
      required:
        - id
        - gameState
        - board
      properties:
        id:
          type: string
        gameState:
          $ref: '#/components/schemas/GameState'
        board:
          $ref: '#/components/schemas/Board'

    BoardStateUpdate:
      type: object
      required:
        - gameState
        - board
      properties:
        gameState:
          type: object
          required:
            - status
            - turn
          properties:
            status:
              $ref: '#/components/schemas/BoardStatus'
            turn:
              $ref: '#/components/schemas/PlayerRole'
            ruleSet:
              type: string
            outcome:
              oneOf:
                - $ref: '#/components/schemas/GameOutcome'
                - type: 'null'
        board:
          $ref: '#/components/schemas/Board'

    PlayerAccess:
      type: object
      required:
        - boardId
        - playerId
        - role
        - token
      properties:
        boardId:
          type: string
        playerId:
          type: string
        role:
          $ref: '#/components/schemas/PlayerRole'
        token:
          type: string

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true